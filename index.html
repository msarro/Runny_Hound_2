<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runny Hound</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <header>
      <h1>Runny Hound</h1>
      <button type="button" id="help-button" aria-haspopup="dialog" aria-controls="help-dialog">
        Help
      </button>
    </header>
    <main>
      <canvas id="game" width="960" height="320" aria-label="Runny Hound game area">
        The game needs a browser with canvas support.
      </canvas>
      <p class="status">The game is coming soon. This page is a placeholder.</p>
    </main>
    <dialog id="help-dialog" aria-labelledby="help-title">
      <h2 id="help-title">Help</h2>
      <div id="help-content"></div>
      <form method="dialog"><button>Close</button></form>
    </dialog>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
